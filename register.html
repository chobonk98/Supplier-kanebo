<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daftar Member - Supplier Kanebo</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="js/shop.js"></script><style>*{box-sizing:border-box}body{font-family:Arial;background:#f3f6f8;margin:0;padding:24px}.box{max-width:430px;margin:30px auto;background:#fff;padding:24px;border-radius:18px}input,button{width:100%;padding:13px;margin:7px 0;border-radius:10px;border:1px solid #ccd4dc}button{background:#16834b;color:white;border:0;font-weight:700}.err{color:#c62828}.ok{color:#16834b}a{color:#16834b}</style></head><body><div class="box"><h1>Buat Akun</h1><form id="form"><input id="name" placeholder="Nama lengkap" required><input id="email" type="email" placeholder="Email / Gmail" required><input id="password" type="password" minlength="6" placeholder="Password minimal 6 karakter" required><button>Daftar</button></form><p id="msg"></p><p>Sudah punya akun? <a href="login.html">Login</a></p></div><script>form.onsubmit=async e=>{e.preventDefault();msg.textContent='';const {data,error}=await shop.supabase.auth.signUp({email:email.value,password:password.value,options:{data:{full_name:name.value}}});if(error){msg.className='err';msg.textContent=error.message}else{msg.className='ok';msg.textContent=data.session?'Akun berhasil dibuat.':'Akun dibuat. Cek email untuk konfirmasi, lalu login.'}};</script></body></html>
