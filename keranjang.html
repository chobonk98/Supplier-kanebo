<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keranjang - Supplier Kanebo</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="js/shop.js"></script><style>*{box-sizing:border-box}body{font-family:Arial;background:#f5f7f8;margin:0}.wrap{max-width:850px;margin:auto;padding:20px}.item{background:#fff;padding:15px;border-radius:14px;margin:10px 0;display:flex;gap:15px;align-items:center}.item img{width:80px;height:80px;object-fit:cover;border-radius:10px}.qty{display:flex;gap:7px;align-items:center}.qty button{width:35px;height:35px}.summary{background:#fff;padding:20px;border-radius:14px;margin-top:20px}.btn{display:block;text-align:center;padding:13px;background:#16834b;color:#fff;text-decoration:none;border-radius:10px;border:0;width:100%;margin-top:10px}.del{background:#eee;border:0;padding:7px;border-radius:7px}.price{margin-left:auto;font-weight:700}</style></head><body><main class="wrap"><p><a href="katalog.html">← Katalog</a></p><h1>Keranjang</h1><div id="list">Memuat...</div><div id="summary"></div></main><script>
async function load(){const u=await shop.requireUser();if(!u)return;const {data,error}=await shop.supabase.from('cart_items').select('id,quantity,product_id,store_products(id,name,price,stock,image_url)').eq('user_id',u.id).order('created_at');if(error){list.textContent=error.message;return}if(!data.length){list.innerHTML='<p>Keranjang masih kosong.</p>';summary.innerHTML='';return}list.innerHTML=data.map(x=>`<div class="item"><img src="${x.store_products.image_url||''}"><div><b>${x.store_products.name}</b><div>${shop.rupiah(x.store_products.price)}</div><div class="qty"><button onclick="change('${x.id}',${x.quantity-1})">−</button><span>${x.quantity}</span><button onclick="change('${x.id}',${Math.min(x.quantity+1,x.store_products.stock)})">+</button><button class="del" onclick="removeItem('${x.id}')">Hapus</button></div></div><div class="price">${shop.rupiah(x.store_products.price*x.quantity)}</div></div>`).join('');const sub=data.reduce((a,x)=>a+x.store_products.price*x.quantity,0);summary.innerHTML=`<div class="summary"><h2>Subtotal: ${shop.rupiah(sub)}</h2><p>Ongkir akan ditentukan saat checkout.</p><a class="btn" href="checkout.html">Lanjut Checkout</a></div>`}
async function change(id,q){if(q<1)return removeItem(id);await shop.supabase.from('cart_items').update({quantity:q,updated_at:new Date().toISOString()}).eq('id',id);load()}async function removeItem(id){await shop.supabase.from('cart_items').delete().eq('id',id);load()}load();
</script></body></html>
