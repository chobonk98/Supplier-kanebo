<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Katalog Produk - Supplier Kanebo</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="js/shop.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f7f8;color:#17202a}.top{background:#16834b;color:#fff;padding:16px;position:sticky;top:0;z-index:2}.topin{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}.nav a,.nav button{color:#fff;margin-left:8px;text-decoration:none;background:none;border:0;font-weight:700}.wrap{max-width:1100px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 5px 20px #00000012}.pic{height:210px;background:#eee;display:flex;align-items:center;justify-content:center}.pic img{width:100%;height:100%;object-fit:cover}.info{padding:16px}.price{font-size:21px;font-weight:800;color:#16834b}.stock{color:#65717a;font-size:14px}.buy{width:100%;padding:12px;background:#16834b;color:#fff;border:0;border-radius:10px;font-weight:700;margin-top:10px}.cart{background:#fff;color:#16834b;padding:9px 12px;border-radius:9px}.msg{text-align:center;padding:30px}</style></head><body><header class="top"><div class="topin"><strong>GROSIR KANEBO</strong><nav class="nav"><a href="katalog.html">Katalog</a><a href="pesanan.html">Pesanan</a><a href="keranjang.html">Keranjang (<span id="count">0</span>)</a><button id="account">Login</button></nav></div></header><main class="wrap"><h1>Katalog Produk</h1><p>Pilih produk, masukkan keranjang, lalu checkout.</p><div id="grid" class="grid"></div></main><script>
async function load(){const {data,error}=await shop.supabase.from('store_products').select('*').eq('active',true).order('created_at',{ascending:false});if(error){grid.innerHTML='<p class="msg">'+error.message+'</p>';return}if(!data.length){grid.innerHTML='<p class="msg">Belum ada produk.</p>';return}grid.innerHTML=data.map(p=>`<article class="card"><div class="pic">${p.image_url?`<img src="${p.image_url}" alt="">`:'📦'}</div><div class="info"><h2>${esc(p.name)}</h2><p>${esc(p.description)}</p><div class="price">${shop.rupiah(p.price)}</div><div class="stock">Stok: ${p.stock}</div><button class="buy" ${p.stock<1?'disabled':''} onclick="buy('${p.id}')">${p.stock<1?'Stok Habis':'Tambah ke Keranjang'}</button></div></article>`).join('');count.textContent=await shop.cartCount();const u=await shop.currentUser();account.textContent=u?'Keluar':'Login';account.onclick=u?shop.signOut:()=>location.href='login.html'}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function buy(id){try{await shop.addToCart(id);count.textContent=await shop.cartCount()}catch(e){alert(e.message)}}load();
</script></body></html>
