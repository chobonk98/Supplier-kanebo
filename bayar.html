<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pembayaran Sandbox</title><script src="https://app.sandbox.midtrans.com/snap/snap.js" data-client-key="PASTE_YOUR_MIDTRANS_CLIENT_KEY_HERE"></script></head><body style="font-family:Arial;text-align:center;padding:30px"><h1>Pembayaran Testing</h1><p>Ini adalah lingkungan Sandbox. Tidak ada uang asli yang dipotong.</p><button id="pay" style="padding:14px 25px;background:#16834b;color:white;border:0;border-radius:10px">Buka Pembayaran</button><p id="msg"></p><script>const q=new URLSearchParams(location.search),token=q.get('token'),order=q.get('order');pay.onclick=()=>{if(!token){msg.textContent='Token pembayaran tidak ditemukan.';return}window.snap.pay(token,{onSuccess:()=>location.href='pesanan.html',onPending:()=>location.href='pesanan.html',onError:()=>msg.textContent='Pembayaran gagal. Silakan coba lagi.',onClose:()=>msg.textContent='Jendela pembayaran ditutup.'})};</script></body></html>
