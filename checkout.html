<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout - Supplier Kanebo</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="js/shop.js"></script><style>*{box-sizing:border-box}body{font-family:Arial;background:#f5f7f8;margin:0}.wrap{max-width:650px;margin:auto;padding:20px}.box{background:#fff;padding:20px;border-radius:16px;margin:12px 0}input,textarea,button{width:100%;padding:13px;margin:7px 0;border:1px solid #ccd4dc;border-radius:10px}button{background:#16834b;color:white;border:0;font-weight:700}.total{font-size:24px;font-weight:800;color:#16834b}.msg{padding:10px;color:#b3261e}</style></head><body><main class="wrap"><p><a href="keranjang.html">← Keranjang</a></p><h1>Checkout</h1><div class="box"><form id="form"><input id="name" placeholder="Nama penerima" required><input id="phone" placeholder="Nomor WhatsApp / HP" required><textarea id="address" rows="4" placeholder="Alamat lengkap" required></textarea><textarea id="notes" rows="2" placeholder="Catatan (opsional)"></textarea><input id="shipping" type="number" min="0" value="0" placeholder="Ongkir"><div id="total" class="total"></div><button>Bayar Sekarang (Sandbox)</button><p id="msg" class="msg"></p></form></div></main><script>
let items=[];let u;
async function load(){u=await shop.requireUser();if(!u)return;const {data,error}=await shop.supabase.from('cart_items').select('id,quantity,product_id,store_products(id,name,price,stock)').eq('user_id',u.id);if(error||!data.length){msg.textContent=error?.message||'Keranjang kosong';return}items=data;const {data:p}=await shop.supabase.from('profiles').select('*').eq('id',u.id).maybeSingle();name.value=p?.full_name||u.user_metadata?.full_name||'';total.textContent='Total: '+shop.rupiah(calc());}function calc(){return items.reduce((a,x)=>a+x.store_products.price*x.quantity,0)+Number(shipping.value||0)}shipping.oninput=()=>total.textContent='Total: '+shop.rupiah(calc());form.onsubmit=async e=>{e.preventDefault();msg.textContent='Membuat transaksi sandbox...';const payload={customer_name:name.value,phone:phone.value,address:address.value,notes:notes.value,shipping:Number(shipping.value||0)};const {data,error}=await shop.supabase.functions.invoke('create-payment',{body:payload});if(error){msg.textContent=error.message;return}if(data?.token){localStorage.setItem('last_order',data.order_id);location.href='bayar.html?token='+encodeURIComponent(data.token)+'&order='+encodeURIComponent(data.order_id)}else msg.textContent=data?.message||'Gagal membuat pembayaran.'};load();
</script></body></html>
