<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login Member - Supplier Kanebo</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="js/shop.js"></script><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f3f6f8;margin:0;padding:24px;color:#17202a}.box{max-width:430px;margin:30px auto;background:white;padding:24px;border-radius:18px;box-shadow:0 8px 30px #0001}input,button{width:100%;padding:13px;margin:7px 0;border-radius:10px;border:1px solid #ccd4dc}button{border:0;background:#16834b;color:white;font-weight:700}.google{background:#fff;color:#222;border:1px solid #ccd4dc}.muted{text-align:center;color:#68737d}.err{color:#c62828}.links{text-align:center;margin-top:15px}a{color:#16834b}</style></head><body><div class="box"><h1>Login Member</h1><p>Masuk untuk membeli produk Supplier Kanebo.</p><form id="form"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button>Login</button></form><button class="google" id="google">Masuk dengan Google</button><p id="msg" class="err"></p><div class="links">Belum punya akun? <a href="register.html">Daftar</a></div></div><script>
const next=new URLSearchParams(location.search).get('next')||'katalog.html';
form.onsubmit=async e=>{e.preventDefault();msg.textContent='';const {error}=await shop.supabase.auth.signInWithPassword({email:email.value,password:password.value});if(error)msg.textContent=error.message;else location.href=next};
google.onclick=async()=>{const {error}=await shop.supabase.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+'/katalog.html'}});if(error)msg.textContent=error.message};
</script></body></html>
