<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Toko - Supplier Kanebo</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f6f8;color:#17202a}.wrap{max-width:1100px;margin:auto;padding:20px}.top{background:#16834b;color:#fff;padding:18px}.topin{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center}.card{background:#fff;border-radius:16px;padding:20px;margin:18px 0;box-shadow:0 5px 20px #0001}input,textarea,button{width:100%;padding:12px;margin:6px 0;border:1px solid #ccd4dc;border-radius:10px;font:inherit}button{background:#16834b;color:#fff;border:0;font-weight:700;cursor:pointer}.danger{background:#c62828}.light{background:#fff;color:#16834b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.item{border:1px solid #e1e6ea;border-radius:14px;overflow:hidden;background:#fff}.item img{width:100%;height:180px;object-fit:cover;background:#eee}.item .p{padding:14px}.price{font-size:20px;font-weight:800;color:#16834b}.muted{color:#68737d}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.msg{padding:10px;text-align:center}@media(max-width:600px){.row{grid-template-columns:1fr}.topin{align-items:flex-start;gap:10px;flex-direction:column}}</style></head><body><header class="top"><div class="topin"><div><small>PANEL ADMIN</small><h2 style="margin:4px 0">Supplier Kanebo</h2></div><button id="logout" class="light" style="width:auto;padding:9px 15px">Keluar</button></div></header><main class="wrap"><section id="login" class="card"><h1>Login Admin</h1><input id="email" type="email" placeholder="Email admin"><input id="password" type="password" placeholder="Password"><button id="loginBtn">Login</button><div id="loginMsg" class="msg"></div></section><section id="panel" hidden><div class="card"><h2 id="formTitle">Tambah Produk</h2><input type="hidden" id="pid"><input id="name" placeholder="Nama produk"><textarea id="desc" rows="3" placeholder="Deskripsi produk"></textarea><div class="row"><input id="price" type="number" min="0" placeholder="Harga (Rp)"><input id="stock" type="number" min="0" placeholder="Stok"></div><input id="image" type="url" placeholder="URL gambar produk (opsional)"><button id="save">Simpan Produk</button><button id="cancel" class="light" hidden>Batal Edit</button><div id="saveMsg" class="msg"></div></div><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2>Produk</h2><button id="refresh" style="width:auto">Muat Ulang</button></div><div id="products" class="grid"></div></div></section></main><script>
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const $=id=>document.getElementById(id);const rupiah=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n||0);
async function isAdmin(){const {data:{user}}=await sb.auth.getUser();if(!user)return false;const {data}=await sb.from('profiles').select('role').eq('id',user.id).maybeSingle();return data?.role==='admin'}
async function boot(){const ok=await isAdmin();$('login').hidden=ok;$('panel').hidden=!ok;if(ok)loadProducts()}
$('loginBtn').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){$('loginMsg').textContent=error.message;return}if(!(await isAdmin())){await sb.auth.signOut();$('loginMsg').textContent='Akun belum memiliki role admin.';return}location.reload()};
$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
async function loadProducts(){const {data,error}=await sb.from('store_products').select('*').order('created_at',{ascending:false});if(error){$('products').innerHTML='<div>'+error.message+'</div>';return}$('products').innerHTML=(data||[]).map(p=>`<article class="item"><img src="${esc(p.image_url||'')}" onerror="this.style.display='none'"><div class="p"><h3>${esc(p.name)}</h3><p class="muted">${esc(p.description)}</p><div class="price">${rupiah(p.price)}</div><div>Stok: ${p.stock} · ${p.active?'Aktif':'Nonaktif'}</div><button onclick='edit(${JSON.stringify(p)})'>Edit</button><button class="danger" onclick="del('${p.id}')">Hapus</button></div></article>`).join('')||'<p>Belum ada produk.</p>'}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
window.edit=p=>{$('pid').value=p.id;$('name').value=p.name;$('desc').value=p.description;$('price').value=p.price;$('stock').value=p.stock;$('image').value=p.image_url||'';$('formTitle').textContent='Edit Produk';$('cancel').hidden=false;scrollTo(0,0)};
$('cancel').onclick=()=>{['pid','name','desc','price','stock','image'].forEach(x=>$(x).value='');$('formTitle').textContent='Tambah Produk';$('cancel').hidden=true};
$('save').onclick=async()=>{const payload={name:$('name').value.trim(),description:$('desc').value.trim(),price:Number($('price').value||0),stock:Number($('stock').value||0),image_url:$('image').value.trim()||null,updated_at:new Date().toISOString()};if(!payload.name){$('saveMsg').textContent='Nama produk wajib diisi.';return}let r=$('pid').value?await sb.from('store_products').update(payload).eq('id',$('pid').value):await sb.from('store_products').insert(payload);if(r.error){$('saveMsg').textContent=r.error.message;return}$('saveMsg').textContent='Produk tersimpan.';$('cancel').click();loadProducts()};
window.del=async id=>{if(!confirm('Hapus produk ini?'))return;const {error}=await sb.from('store_products').delete().eq('id',id);if(error)alert(error.message);else loadProducts()};$('refresh').onclick=loadProducts;boot();
</script></body></html>
